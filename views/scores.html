<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obstacle Course — IM Competition</title>
<link rel="preload" href="/assets/fonts/chakra-petch-700-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/atkinson-hyperlegible-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/pixel.css">
<style>
/* Public scoreboard: read-only. One column, three windows: last results, now playing, leaderboard. */
main.page.viewer,.viewer-body .hud{max-width:1240px}
.stage-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.q{list-style:none;margin:0;padding:0}
.q li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px 0;border-top:2px solid var(--well)}
.q li:first-child{border-top:0;padding-top:0}
.q .px{font-size:20px}
.q b{font:700 20px/1.2 var(--ui);overflow-wrap:anywhere}
.q small{grid-column:2;color:var(--ink-2);font-size:15px}
.q .first .px,.q .first b{color:var(--p1)}
.qh{margin:16px 0 6px;font:700 15px var(--ui);color:var(--ink-2)}
.q .qvs{display:inline-block;margin:0 6px;font:700 12px/1 var(--px);color:var(--ink-2);text-transform:uppercase}
@media (max-width:900px){.stage-row{grid-template-columns:minmax(0,1fr)}}

/* ----- Last results ----- */
.log ol{list-style:none;margin:0;padding:0}
.rc{display:grid;grid-template-columns:52px minmax(0,1fr) auto 72px 84px;gap:14px;align-items:center;padding:8px 2px;border-top:2px solid var(--well)}
.rc:first-child{border-top:0}
.rc .px{font-size:14px}
.rc b{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc b small{font-size:15px;color:var(--ink-2);margin-left:10px}
.rc .det{color:var(--ink-2);font-size:16px;white-space:nowrap}
.rc .sc{font:700 16px/1 var(--px);text-align:right}
.rc .res{justify-self:end}
.rc.pop .sc{animation:rise .9s steps(6) both}
@keyframes rise{0%{transform:translateY(10px);color:var(--p1)}60%{transform:translateY(-3px);color:var(--p1)}100%{transform:none}}
.none{margin:0;color:var(--ink-2)}

/* ----- Now playing ----- */
.faceoff{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.fighter{display:grid;gap:6px;align-content:start;padding:12px 14px}
.fighter{background:var(--well)}
.fighter.p1{background:#fff;outline:2px solid var(--ink);outline-offset:-2px}
.fighter .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fighter .no{font:700 40px/1 var(--px);color:var(--ink)}
.fighter.p2 .no{font-size:26px}
.oncourse{display:inline-block;padding:3px 8px;background:var(--p1);color:#fff;font:700 14px/1.2 var(--ui)}
.fighter .nm{font:700 30px/1.15 var(--ui);overflow-wrap:anywhere}
.fighter.p2 .nm{font-size:22px}
.fighter .mem{font-size:16px;color:var(--ink-2)}
.fighter .beat{font-size:16px;color:var(--ink-2)}
.fighter .beat .px{font-size:18px;color:var(--ink);margin-left:6px}
.vsbig{align-self:center;font:700 18px/1 var(--px);padding:8px;background:var(--ink);color:#fff}
.nowline{display:flex;flex-wrap:wrap;gap:6px 24px;margin:14px 0 0;color:var(--ink-2);font-size:17px}
.nowline b{color:var(--ink);font-weight:400}
.nowline .px{font-size:14px;color:var(--ink)}
.clear{display:grid;justify-items:center;text-align:center;gap:10px;padding:14px 8px}
.clear .px{font-size:22px;color:var(--hp-ink)}
.clear .ico{height:44px;color:var(--gold)}
.clear.champ .px{color:var(--gold-ink)}

/* ----- Leaderboard ----- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tabs .btn{min-height:38px;font-size:14px}
.board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{font:400 14px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:6px 8px 8px}
.board td{padding:9px 8px;border-top:2px solid var(--well);vertical-align:middle;font-size:18px}
.board tr.top td{background:var(--gold-tint);border-top-color:var(--gold-tint)}
.board .r{text-align:right}
.board .rank{width:56px}
.board .rank .px{font-size:14px}
.board .team .px{font-size:12px;color:var(--ink-2);margin-right:10px}
.board .scorec{font:700 15px/1 var(--px)}
.board .dist{color:var(--ink-2)}
.board .team small{display:none}
.board-foot{margin:10px 0 0;color:var(--ink-2);font-size:15px}

/* ----- Results by match (both teams of each fixture together) ----- */
.mb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mb li{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px 10px;align-items:stretch;padding:8px 10px;background:var(--well)}
.mb .mhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 13px/1 var(--px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.mb .mhead .mt{font:700 14px var(--ui);color:var(--p2);text-transform:none;letter-spacing:0}
.mb .mcell{display:grid;gap:4px;align-content:center;padding:8px 10px;background:#fff;outline:2px solid transparent;outline-offset:-2px}
.mb .mcell .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mb .mcell .px{font-size:13px;color:var(--ink-2)}
.mb .mcell .t{font:700 18px/1.15 var(--ui);overflow-wrap:anywhere}
.mb .mcell .meta{display:flex;align-items:center;gap:10px}
.mb .mcell .s{font:700 17px/1 var(--px)}
.mb .mcell.won{outline-color:var(--gold);background:var(--gold-tint)}
.mb .mcell.won .s{color:var(--gold-ink)}
.mb .mcell.lost{opacity:.6}
.mb .mcell.bye{align-items:center;color:var(--ink-2)}
.mb .vsm{align-self:center;font:700 12px/1 var(--px);padding:6px;background:var(--ink);color:#fff}
@media (max-width:720px){.mb li{grid-template-columns:minmax(0,1fr)}.mb .vsm{justify-self:center}}

@media (max-width:720px){
  .rc{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"no nm sc" "no det res";gap:2px 10px}
  .rc .px{grid-area:no}.rc b{grid-area:nm}.rc .sc{grid-area:sc}.rc .det{grid-area:det;font-size:15px}.rc .res{grid-area:res}
  .rc b small{display:none}
  .faceoff{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px}
  .fighter{padding:8px}
  .fighter .no,.fighter.p2 .no{font-size:18px}
  .fighter .nm,.fighter.p2 .nm{font-size:19px}
  .fighter .mem{display:none}
  .fighter .beat,.fighter .beat .px{font-size:14px}
  .vsbig{font-size:11px;padding:5px}
  .board .d-only{display:none}
  .board .team small{display:block;font-size:14px;color:var(--ink-2)}
  .board td{padding:8px 6px;font-size:17px}
  .board th{padding:4px 6px 6px}
}
</style>
</head>
<body class="viewer-body">
<header class="hud">
  <a class="logo" href="/"><b>IM Competition</b><span>FM214 · Obstacle course</span></a>
  <nav class="menu win" aria-label="Dashboards"></nav>
  <div class="status"><span class="live" role="status"><i></i><span>Live</span></span></div>
</header>

<main class="page viewer">
  <section class="win log" id="recent" aria-labelledby="recentH"></section>
  <div class="stage-row">
    <section class="win p1 now" id="now" aria-live="polite"></section>
    <section class="win next" id="next" aria-labelledby="nextH"></section>
  </div>
  <section class="win board" id="board"></section>
</main>

<script src="/assets/tournament.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/obstacle.js"></script>
<script>
(() => {
const { $, esc, icon, fmt } = UI;
const T = Tournament, O = Obstacle;
UI.hud('scores');
let boardStage = null, lastRecent = null;

function renderRecent() {
  const B = O.B, list = B.recent.slice(0, 3);
  const head = list[0] ? list[0].stage + ':' + list[0].team + ':' + list[0].run.t : '';
  const isNew = lastRecent !== null && head && head !== lastRecent;
  lastRecent = head;
  const rows = list.map((x, i) => {
    const st = B.S[x.stage], m = T.teamResult(st, x.team).m;
    return `<li class="rc${i === 0 && isNew ? ' pop' : ''}"><span class="px">${O.tag(x.team)}</span>
      <b>${esc(O.tname(x.team))}<small>${esc(T.byId[x.stage].short)} · Match ${esc(m ? m.no : '')}</small></b>
      <span class="det">${O.formula(x.run)}</span><span class="sc">${O.scoreText(x.run)}</span><span class="res">${O.resultTag(st, x.team)}</span></li>`;
  });
  $('recent').innerHTML = `<h2 class="win-title" id="recentH">Last results</h2>`
    + (rows.length ? `<ol>${rows.join('')}</ol>` : '<p class="none">No runs yet. Results appear here as each team finishes.</p>');
}

function renderNow() {
  const B = O.B, el = $('now');
  if (!B.current) {
    if (B.podium) {
      const p = B.podium;
      el.innerHTML = `<h2 class="win-title">Champion</h2><div class="clear champ">${icon('trophy')}<div class="px">${O.tag(p.first)} ${esc(O.tname(p.first))}</div>
        <div class="dim">2nd ${O.tag(p.second)} ${esc(O.tname(p.second))}${p.third ? ` · 3rd ${O.tag(p.third)} ${esc(O.tname(p.third))}` : ''}</div></div>`;
      return;
    }
    const a = B.active, ties = (a.ties || []).length + (a.wildcardTie ? 1 : 0);
    el.innerHTML = `<h2 class="win-title">${esc(a.name)}</h2><div class="clear"><div class="px">${a.status === 'locked' ? 'Get ready' : 'Stage clear!'}</div>
      <div class="dim">${a.status === 'locked' ? 'The match-ups will appear here soon.' : ties ? 'The moderators are deciding a tie.' : 'Every team in this stage has run.'}</div></div>`;
    return;
  }
  const { stage: sid, team } = B.current, st = B.S[sid];
  const { m } = T.teamResult(st, team);
  const mtime = m && m.time ? ` · ${esc(m.time)}` : '';
  // Both teams of the fixture run together, so show them side by side as one matchup.
  const fighter = t => t
    ? `<div class="fighter p1"><div class="who"><span class="oncourse">On course</span>${O.seedTag(st, m, t)}${O.arenaTag(m, t)}</div><span class="no">${O.tag(t)}</span>
        <div class="nm">${esc(O.tname(t))}</div>${O.members(t) ? `<div class="mem">${esc(O.members(t))}</div>` : ''}</div>`
    : `<div class="fighter p1"><div class="nm">Bye</div><div class="mem">No opponent this round</div></div>`;
  el.innerHTML = `<h2 class="win-title">Now playing<span class="sub">${esc(st.name)} · Match ${esc(m ? m.no : '')}${mtime} · ${st.done}/${st.total} run</span></h2>
    <div class="faceoff">
      ${fighter(m.a)}
      <span class="vsbig" aria-label="versus">VS</span>
      ${fighter(m.b)}
    </div>`;
}

function renderNext() {
  const B = O.B, st = B.current ? B.S[B.current.stage] : B.active;
  const curMatch = B.current ? st.matches.find(x => x.a === B.current.team || x.b === B.current.team) : null;
  const rs = (O.store.data.runs || {})[st.id] || {};
  const acted = t => rs[t] && (rs[t].status === 'done' || rs[t].status === 'forfeit');
  const teamsOf = m => [m.a, m.b].filter(Boolean);
  const mDone = m => teamsOf(m).every(acted);
  const mSkip = m => teamsOf(m).some(t => rs[t] && rs[t].status === 'skip');
  const all = (st.matches || []).filter(m => m.a || m.b);
  const upcoming = all.filter(m => m !== curMatch && !mDone(m) && !mSkip(m)).slice(0, 4);
  const later = all.filter(m => m !== curMatch && !mDone(m) && mSkip(m));
  const li = (m, i) => {
    const tm = m.time ? ' · ' + esc(m.time) : '';
    const names = teamsOf(m).map(t => `${O.tag(t)} ${esc(O.tname(t))}${O.arenaTag(m, t) ? ' ' + O.arenaTag(m, t) : ''}`).join('<span class="qvs">vs</span>');
    return `<li class="${i === 0 ? 'first' : ''}"><span class="px">M${esc(m.no)}</span><b>${names}</b><small>${i === 0 ? 'Up next · ' : ''}Match ${esc(m.no)}${tm}</small></li>`;
  };
  $('next').innerHTML = `<h2 class="win-title" id="nextH">Up next</h2>`
    + (upcoming.length ? `<ol class="q">${upcoming.map((m, i) => li(m, i)).join('')}</ol>` : '<p class="none">No more matches waiting in this stage.</p>')
    + (later.length ? `<h3 class="qh">Running later</h3><ul class="q">${later.map(m => li(m, 1)).join('')}</ul>` : '');
}

function renderBoard() {
  const B = O.B, runs = O.store.data.runs || {};
  const open = B.stages.filter(s => s.status !== 'locked');
  const hasResults = s => Object.values(runs[s.id] || {}).some(r => r.status === 'done' || r.status === 'forfeit');
  let sel = boardStage && B.S[boardStage] && B.S[boardStage].status !== 'locked' ? B.S[boardStage] : (B.current ? B.S[B.current.stage] : B.active);
  if (!boardStage && !hasResults(sel)) { const prev = open.filter(hasResults).pop(); if (prev) sel = prev; }
  const rs = runs[sel.id] || {};
  const matches = (sel.matches || []).filter(m => m.a || m.b);
  // Each fixture is shown with both teams together; the winner is highlighted.
  const cell = (m, t, won, lost) => {
    if (!t) return `<div class="mcell bye"><span class="t">Bye</span></div>`;
    return `<div class="mcell${won ? ' won' : ''}${lost ? ' lost' : ''}">
      <div class="who">${O.arenaTag(m, t)}<span class="px">${O.tag(t)}</span><span class="t">${esc(O.tname(t))}</span></div>
      <div class="meta"><span class="s">${O.scoreText(rs[t])}</span>${O.resultTag(sel, t)}</div></div>`;
  };
  const row = m => {
    const tm = m.time ? `<span class="mt">${esc(m.time)}</span>` : '';
    return `<li><div class="mhead"><span class="mno">Match ${esc(m.no)}</span>${tm}</div>
      ${cell(m, m.a, m.winner === m.a && !!m.a, m.loser === m.a && !!m.a)}
      <span class="vsm" aria-label="versus">VS</span>
      ${cell(m, m.b, m.winner === m.b && !!m.b, m.loser === m.b && !!m.b)}</li>`;
  };
  const tabs = open.length > 1 ? `<div class="tabs" role="tablist" aria-label="Stage">${open.map(s => `<button type="button" role="tab" class="btn" data-tab="${s.id}" aria-selected="${s.id === sel.id}" aria-pressed="${s.id === sel.id}">${esc(s.short)}</button>`).join('')}</div>` : '';
  $('board').innerHTML = `<h2 class="win-title">Leaderboard<span class="sub">${esc(sel.name)} · by match</span></h2>${tabs}
    ${matches.length ? `<ul class="mb">${matches.map(row).join('')}</ul>` : '<p class="none">No matches in this stage yet.</p>'}
    <p class="board-foot">Score = T1 distance × T2 distance (cm). Lower score wins the match.</p>`;
}

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { boardStage = tb.dataset.tab; renderBoard(); }
});
O.start({ render: () => { renderRecent(); renderNow(); renderNext(); renderBoard(); } });
})();
</script>
</body>
</html>
